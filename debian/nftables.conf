table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		icmp type echo-request accept
		tcp dport 22 ct state new accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iif "ens33" oif "ens37" tcp dport 22 ip daddr 10.0.0.2 ct state new accept
		iif "ens33" oif "ens38" tcp dport 22 ip daddr 192.168.67.2 ct state new accept
		iif "ens37" oif "ens38" icmp type echo-request accept
		iif "ens38" oif "ens37" icmp type echo-request accept
		iif { "ens33", "ens37" } oif "ens38" udp dport 53 ip daddr 192.168.67.2 ct state new accept
		iif { "ens37", "ens38" } oif "ens33" ct state new accept
	}
}
table ip nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		iif "ens33" tcp dport 2221 dnat to 10.0.0.2:22
		iif "ens33" tcp dport 2222 dnat to 192.168.67.2:22
		iif "ens33" tcp dport 53 dnat to 192.168.67.2:53
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oif "ens33" masquerade
	}
}
